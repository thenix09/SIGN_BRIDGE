name: CI

on:
  push:
    branches: ["main", "person-a-backend", "person-b-ml", "person-c-frontend"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Type check with mypy
        run: |
          mypy backend/app

      - name: Run tests with coverage
        run: |
          pytest --cov=backend/app --cov-report=term-missing --cov-fail-under=80

      - name: Check word accuracy gate
        if: hashFiles('backend/models/word_metrics.json') != ''
        run: |
          python backend/scripts/check_gate.py
