[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "signbridge"
version = "1.0.0"
description = "Two-way isolated ASL sign language bridge"
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["backend/app"]
omit = ["backend/tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
